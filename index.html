<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c32"><meta name="description" content="매일 두세 문장씩 쌓아가는 나의 영어 독해 공부 기록">
<title>Daily English | 나의 영어 독해 노트</title>
<style>
:root{color-scheme:light;--navy:#14223e;--ink:#15243d;--muted:#64748b;--bg:#f4f6fb;--line:#dfe5ed;--accent:#3667db;--soft:#edf3ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75}button{font:inherit;cursor:pointer}header{background:linear-gradient(125deg,#10203d,#233d70);color:white;padding:60px max(24px,calc((100vw - 1050px)/2)) 52px}.eyebrow{letter-spacing:.15em;color:#aebee1;font-size:13px;font-weight:700}h1{font-size:clamp(32px,5vw,48px);line-height:1.25;letter-spacing:-.035em;margin:12px 0}header p{color:#d8e1f6;margin:0}main{max-width:1050px;margin:0 auto;padding:28px 24px 90px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}.sidebar{position:sticky;top:24px;background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.side-label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.11em;margin:0 0 8px}.daybtn{width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:10px;padding:13px 12px;display:flex;justify-content:space-between;align-items:center}.daybtn.active{background:var(--soft);color:#2457c3;font-weight:800}.daybtn small{color:var(--muted)}.hint{font-size:12px;line-height:1.65;color:var(--muted);padding:12px 4px 0}.topline{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:0 0 20px}.topline h2{font-size:30px;margin:0;letter-spacing:-.04em}.date{color:var(--muted);font-size:14px}.pill{font-size:12px;border-radius:99px;background:#e7edfb;color:#2856af;font-weight:750;padding:5px 10px}.lesson{background:#fff;border:1px solid var(--line);border-radius:18px;padding:27px 30px;margin-bottom:18px;box-shadow:0 5px 16px #1e335009}.num{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.1em}.en{font-size:clamp(20px,2.4vw,26px);font-family:Georgia,"Times New Roman",serif;line-height:1.55;margin:10px 0 18px;color:#19253a;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid #d8e1f0;background:#fff;padding:8px 14px;border-radius:9px;font-size:13px;color:#244e9b;font-weight:750}.action:hover{background:var(--soft)}.answer{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.answer[hidden]{display:none}h3{font-size:14px;margin:15px 0 7px;color:#244e9b}.ko{font-size:16px;font-weight:650;margin:4px 0 14px}.mine{background:#f7f9fd;padding:12px 15px;border-radius:10px;margin:5px 0;color:#354560}.note{font-size:14px;color:#46566b;margin:5px 0}.vocab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:0;margin:8px 0 12px;border:1px solid var(--line);border-radius:11px;overflow:hidden;font-size:14px}.vocab div{padding:8px 12px;border-bottom:1px solid var(--line)}.vocab div:nth-child(odd){background:#f7f9fc;font-weight:650}.vocab div:nth-last-child(-n+2){border-bottom:0}.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:34px}.mobile-nav{display:none}@media(max-width:700px){header{padding:40px 22px}main{padding:20px 14px 65px}.layout{display:block}.sidebar{position:static;margin-bottom:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sidebar .side-label{width:100%}.sidebar .hint{display:none}.daybtn{width:auto;flex:1}.lesson{padding:21px 18px}.topline h2{font-size:26px}.vocab{font-size:13px}}
</style>
</head>
<body>
<header><div class="eyebrow">MY ENGLISH JOURNAL</div><h1>하루씩 쌓이는<br>영어 독해 노트</h1><p>해석부터 어휘·문장 구조·문법까지, 천천히 꾸준히.</p></header>
<main><div class="layout"><nav class="sidebar" aria-label="날짜별 학습 목차"><div class="side-label">STUDY DAYS</div><button class="daybtn active" data-day="1">Day 01 <small>3문장</small></button><button class="daybtn" data-day="2">Day 02 <small>2문장</small></button><div class="hint">먼저 영어 문장을 직접 해석해 보세요. <b>해설 보기</b>를 누르면 정답과 설명이 펼쳐집니다.<br>듣기 버튼은 넣지 않았습니다.</div></nav><section><div class="topline"><div><div class="date" id="date">2026.10.26 · 월요일</div><h2 id="heading">Day 01</h2></div><div class="pill" id="counter">3 SENTENCES</div></div><div id="lessons"></div><div class="foot">Daily English · GitHub Pages에서 바로 실행되는 정적 홈페이지</div></section></div></main>
<script>
// 새 학습일을 추가할 때 아래 DATA에 새로운 날짜와 문장을 추가하면 됩니다.
const DATA=[
{day:1,date:'2026.10.26 · 월요일',items:[
{en:'Although he was tired after a long day, he decided to finish his homework before going to bed.',ko:'긴 하루를 보내고 피곤했지만, 그는 잠자리에 들기 전에 숙제를 끝내기로 결심했다.',vocab:[['although','비록 ~이지만'],['be tired after','~을 하고 나서 피곤하다'],['decide to + 동사원형','~하기로 결심하다'],['finish + -ing','~하는 것을 끝내다'],['before going to bed','잠자리에 들기 전에']],structure:'Although + 주어 + 동사(양보절), 주어 + 동사(주절). / he decided to finish … 가 문장의 중심입니다.',grammar:'Although는 양보를 나타내는 접속사입니다. decide 뒤에는 to부정사가 오고, finish 뒤에는 동명사(-ing)가 옵니다. before going은 before he went의 의미로 이해할 수 있습니다.'},
{en:'The more time you spend practicing something, the more confident you will become.',ko:'무언가를 연습하는 데 더 많은 시간을 쓸수록, 자신감이 더 커질 것이다.',vocab:[['the more A, the more B','A할수록 더욱 B하다'],['spend time + -ing','~하는 데 시간을 쓰다'],['practice','연습하다'],['confident','자신감 있는'],['become','~해지다']],structure:'The more time [you spend practicing something], the more confident [you will become]. 두 비교급 절이 대응합니다.',grammar:'「the + 비교급, the + 비교급」은 ‘~할수록 더욱 …하다’라는 상관 비교급 구문입니다. spend time 뒤의 practicing은 동명사입니다.'},
{en:'Many people believe that success depends not only on talent but also on how much effort you put into your work.',ko:'많은 사람들은 성공이 재능뿐 아니라 자신의 일에 얼마나 많은 노력을 기울이는지에도 달려 있다고 믿는다.',vocab:[['believe that','~라고 믿다'],['depend on','~에 달려 있다'],['not only A but also B','A뿐만 아니라 B도'],['how much effort','얼마나 많은 노력'],['put effort into','~에 노력을 기울이다']],structure:'Many people(주어) + believe(동사) + that절(목적어). that절 안의 주어 success, 동사 depends, 전치사 on의 목적어가 병렬을 이룹니다.',grammar:'not only talent but also how much effort … 는 on 뒤에 오는 두 요소를 연결합니다. how much effort you put into your work는 「의문사 + 주어 + 동사」 어순의 간접의문문입니다.'}
]},
{day:2,date:'2026.10.27 · 화요일',items:[
{en:'People who read books regularly tend to understand the world from different perspectives.',ko:'정기적으로 책을 읽는 사람들은 세상을 다양한 관점에서 이해하는 경향이 있다.',mine:'책을 읽는 사람들은 일반적으로 세상을 다른 perspectives로부터 이해하려는 경향이 있다.',score:'85/100',vocab:[['regularly','정기적으로, 규칙적으로'],['tend to + 동사원형','~하는 경향이 있다'],['perspective','관점, 시각'],['from different perspectives','다양한 관점에서'],['understand','이해하다']],structure:'People(주어) + [who read books regularly](관계대명사절) + tend(주절 동사) + to understand the world(내용).',grammar:'who read books regularly는 People을 꾸미는 주격 관계대명사절입니다. regularly는 여기서 ‘일반적으로’보다 ‘규칙적으로’가 정확합니다.'},
{en:'Although learning a new language can be difficult at first, it becomes easier as you practice more.',ko:'새로운 언어를 배우는 것은 처음에는 어려울 수 있지만, 연습을 많이 할수록 점점 쉬워진다.',mine:'새로운 언어는 배우는 것은 처음에는 어렵지만, 당신이 더욱 연습할수록 쉬워지게 될 것이다.',score:'98/100',vocab:[['although','비록 ~이지만'],['learning a new language','새로운 언어를 배우는 것'],['can be difficult','어려울 수 있다'],['at first','처음에는'],['become easier','더 쉬워지다'],['as you practice more','더 많이 연습할수록']],structure:'Although [learning a new language](동명사구 주어) can be difficult at first(양보절), it becomes easier(주절) as you practice more(부사절).',grammar:'learning a new language 전체가 주어로 쓰인 동명사구입니다. it은 그 내용을 다시 가리킵니다. as는 변화가 함께 일어남을 나타내어 ‘~할수록’로 자연스럽게 해석합니다.'}
]}];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(day){const item=DATA.find(x=>x.day===day);if(!item)return;document.querySelectorAll('.daybtn').forEach(b=>{const on=Number(b.dataset.day)===day;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});document.getElementById('heading').textContent=`Day ${String(day).padStart(2,'0')}`;document.getElementById('date').textContent=item.date;document.getElementById('counter').textContent=`${item.items.length} SENTENCES`;document.getElementById('lessons').innerHTML=item.items.map((s,i)=>`<article class="lesson"><div class="num">SENTENCE ${String(i+1).padStart(2,'0')}</div><p class="en" lang="en">${escapeHTML(s.en)}</p><div class="actions"><button type="button" class="action toggle" aria-expanded="false">해설 보기 ↓</button></div><div class="answer" hidden><h3>자연스러운 해석</h3><p class="ko">${escapeHTML(s.ko)}</p>${s.mine?`<h3>내가 작성한 해석 ${s.score?`· ${escapeHTML(s.score)}`:''}</h3><p class="mine">${escapeHTML(s.mine)}</p>`:''}<h3>핵심 어휘와 표현</h3><div class="vocab">${s.vocab.map(v=>`<div>${escapeHTML(v[0])}</div><div>${escapeHTML(v[1])}</div>`).join('')}</div><h3>문장 구조</h3><p class="note">${escapeHTML(s.structure)}</p><h3>문법 포인트</h3><p class="note">${escapeHTML(s.grammar)}</p></div></article>`).join('');document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const a=b.closest('.lesson').querySelector('.answer');const show=a.hidden;a.hidden=!show;b.textContent=show?'해설 접기 ↑':'해설 보기 ↓';b.setAttribute('aria-expanded',String(show))}));location.hash=`day-${String(day).padStart(2,'0')}`}
document.querySelectorAll('.daybtn').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.day))));const initial=Number((location.hash.match(/day-0?(\d+)/)||[])[1]||1);render(DATA.some(x=>x.day===initial)?initial:1);
</script>
</body></html>
