<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English | 나의 영어 독해 노트</title><style>:root{--bg:#f3f6fb;--ink:#182942;--accent:#315ec5;--muted:#60718b;--line:#dce3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}header{padding:52px max(22px,calc((100vw - 1080px)/2));background:linear-gradient(120deg,#12213c,#274574);color:white}header small{letter-spacing:.17em;color:#bdcae8}h1{font-size:clamp(30px,4vw,46px);line-height:1.25;margin:12px 0}header p{color:#d8e3fa}main{max-width:1080px;margin:auto;padding:28px 20px 80px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:20px;align-self:start}.sidebar h2{font-size:13px;color:var(--muted);letter-spacing:.1em}.daybtn{display:block;width:100%;background:transparent;border:0;border-radius:10px;padding:13px 10px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.daybtn.active{background:#e8efff;color:#2454b9;font-weight:750}.daybtn small{float:right;color:var(--muted)}.card{border:1px solid var(--line);border-radius:17px;background:white;padding:25px 28px;margin:16px 0;box-shadow:0 4px 20px #233a5709}.eyebrow{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.12em}.en{font:clamp(20px,2.5vw,26px)/1.55 Georgia,serif;overflow-wrap:anywhere}.action{border:1px solid #bfcce6;background:white;color:#214d9b;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}.answer{border-top:1px solid var(--line);padding-top:12px;margin-top:19px}.answer[hidden]{display:none}h3{font-size:15px;color:#2955a8;margin:16px 0 5px}.note{color:#4d5c70}.mine{background:#f4f7fc;padding:12px;border-radius:10px}.vocab{display:grid;grid-template-columns:1fr 1.4fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}.vocab div{padding:6px 10px;border-bottom:1px solid var(--line)}.vocab div:nth-child(odd){background:#f5f7fc;font-weight:700}.vocab div:nth-last-child(-n+2){border-bottom:0}.quiz label{display:block;padding:8px 0;cursor:pointer}.result{font-weight:650;color:#315ec5}.meta{color:var(--muted);font-size:14px}button:focus-visible,input:focus-visible{outline:3px solid #8cadff}@media(max-width:690px){.layout{display:block}.sidebar{position:static;margin-bottom:20px}.daybtn{display:inline-block;width:49%;font-size:14px}.daybtn small{display:none}.card{padding:19px}.vocab{font-size:14px}header{padding:35px 20px}}
.score{display:inline-block;background:#e8efff;color:#214d9b;border:1px solid #c4d4f6;border-radius:12px;padding:8px 16px;font-size:24px;font-weight:800}.score small{font-size:14px;font-weight:500}.grammar-detail{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}.grammar-detail h4{margin:0 0 8px;font-size:16px;color:#2955a8}.grammar-detail p{margin:8px 0}.example{background:#f4f7fc;padding:12px;border-radius:10px}.example p[lang=en]{font-family:Georgia,serif;font-size:18px;overflow-wrap:anywhere}.wordtable{width:100%;border-collapse:collapse;font-size:15px;overflow-wrap:anywhere}.wordtable th,.wordtable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.wordtable th{background:#f5f7fc}.wordtable td:first-child{width:40%}.quiz fieldset{min-width:0;margin:0;padding:0;border:0}.quiz legend{font-weight:700;width:100%;margin:12px 0}.quiz label{border-radius:8px;padding:9px 8px}.quiz label:has(input:checked){background:#e8efff}.quiz input{accent-color:#315ec5}.quiz .action{margin:12px 8px 0 0}.quiz .result{overflow-wrap:anywhere}.quiz .result:empty{margin:0}.lesson-goal{color:var(--muted);font-size:14px}.remember{padding:12px;background:#e8efff;border-radius:10px}@media(max-width:690px){.wordtable{font-size:14px}.wordtable th,.wordtable td{padding:7px}}@media print{header{padding:20px;background:white;color:#182942}header small,header p{color:#60718b}.layout{display:block}.sidebar,.reveal,.quiz .action{display:none}.answer[hidden]{display:block}.card{box-shadow:none;break-inside:avoid}main{padding:0}}
</style></head><body><header><small>MY ENGLISH JOURNAL</small><h1>하루씩 쌓이는<br>영어 독해 노트</h1><p>해석부터 어휘·문장 구조·문법까지, 천천히 꾸준히.</p></header><main><div class="layout"><nav class="sidebar" aria-label="날짜별 학습 목차"><h2>STUDY DAYS</h2><button class="daybtn" data-day="1">Day 01 <small>3문장</small></button><button class="daybtn" data-day="2">Day 02 <small>2문장</small></button><button class="daybtn" data-day="3">Day 03 <small>1문장</small></button><button class="daybtn" data-day="4">Day 04 <small>1문장</small></button><p class="meta">영어 문장을 먼저 해석하고 해설 보기를 눌러 확인하세요.</p></nav><section><div class="meta" id="date"></div><h2 id="heading"></h2><div id="lessons"></div></section></div></main><script>const DATA=[{"day":1,"date":"2026.10.26 · 월요일","items":[{"en":"Although he was tired after a long day, he decided to finish his homework before going to bed.","ko":"긴 하루를 보내고 피곤했지만, 그는 잠자리에 들기 전에 숙제를 끝내기로 결심했다.","mine":"","structure":"Although + 주어 + 동사(양보절), 주어 + 동사(주절). / he decided to finish가 문장의 중심입니다.","grammar":"Although는 양보를 나타내는 접속사입니다. decide 뒤에는 to부정사가 오고, finish 뒤에는 동명사(-ing)가 옵니다. before going은 before he went의 의미로 이해할 수 있습니다.","vocab":[["although","비록 ~이지만"],["be tired after","~을 하고 나서 피곤하다"],["decide to + 동사원형","~하기로 결심하다"],["finish + -ing","~하는 것을 끝내다"],["before going to bed","잠자리에 들기 전에"]]},{"en":"The more time you spend practicing something, the more confident you will become.","ko":"무언가를 연습하는 데 더 많은 시간을 쓸수록, 자신감이 더 커질 것이다.","mine":"","structure":"The more time [you spend practicing something], the more confident [you will become]. 두 비교급 절이 대응합니다.","grammar":"the + 비교급, the + 비교급은 ~할수록 더욱 …하다라는 구문입니다. spend time 뒤의 practicing은 동명사입니다.","vocab":[["the more A, the more B","A할수록 더욱 B하다"],["spend time + -ing","~하는 데 시간을 쓰다"],["practice","연습하다"],["confident","자신감 있는"],["become","~해지다"]]},{"en":"Many people believe that success depends not only on talent but also on how much effort you put into your work.","ko":"많은 사람들은 성공이 재능뿐 아니라 자신의 일에 얼마나 많은 노력을 기울이는지에도 달려 있다고 믿는다.","mine":"","structure":"Many people(주어) + believe(동사) + that절(목적어). that절 안의 주어 success, 동사 depends, 전치사 on의 목적어가 병렬을 이룹니다.","grammar":"not only talent but also how much effort … 는 on 뒤에 오는 두 요소를 연결합니다. how much effort you put into your work는 간접의문문입니다.","vocab":[["believe that","~라고 믿다"],["depend on","~에 달려 있다"],["not only A but also B","A뿐만 아니라 B도"],["how much effort","얼마나 많은 노력"],["put effort into","~에 노력을 기울이다"]]}]},{"day":2,"date":"2026.10.27 · 화요일","items":[{"en":"People who read books regularly tend to understand the world from different perspectives.","ko":"정기적으로 책을 읽는 사람들은 세상을 다양한 관점에서 이해하는 경향이 있다.","mine":"책을 읽는 사람들은 일반적으로 세상을 다른 perspectives로부터 이해하려는 경향이 있다.","structure":"People(주어) + [who read books regularly](관계대명사절) + tend(주절 동사) + to understand the world(내용).","grammar":"who read books regularly는 People을 꾸미는 주격 관계대명사절입니다. regularly는 여기서 일반적으로보다 규칙적으로가 정확합니다.","vocab":[["regularly","정기적으로, 규칙적으로"],["tend to + 동사원형","~하는 경향이 있다"],["perspective","관점, 시각"],["from different perspectives","다양한 관점에서"],["understand","이해하다"]]},{"en":"Although learning a new language can be difficult at first, it becomes easier as you practice more.","ko":"새로운 언어를 배우는 것은 처음에는 어려울 수 있지만, 연습을 많이 할수록 점점 쉬워진다.","mine":"새로운 언어는 배우는 것은 처음에는 어렵지만, 당신이 더욱 연습할수록 쉬워지게 될 것이다.","structure":"Although [learning a new language](동명사구 주어) can be difficult at first(양보절), it becomes easier(주절) as you practice more(부사절).","grammar":"learning a new language 전체가 주어로 쓰인 동명사구입니다. it은 그 내용을 다시 가리킵니다. as는 ~할수록로 자연스럽게 해석합니다.","vocab":[["although","비록 ~이지만"],["learning a new language","새로운 언어를 배우는 것"],["can be difficult","어려울 수 있다"],["at first","처음에는"],["become easier","더 쉬워지다"],["as you practice more","더 많이 연습할수록"]]}]},{"day":3,"date":"2026.10.28 · 수요일","items":[{"en":"Learning a new language takes time, but practicing a little every day can make a big difference.","ko":"새로운 언어를 배우는 데는 시간이 걸리지만, 매일 조금씩 연습하면 큰 차이를 만들어 낼 수 있다.","mine":"새로운 언어를 배우는 것은 시간이 걸리지만, 매일 조금씩 연습하면 큰 변화를 만들 수 있다.","structure":"첫 절: Learning a new language(S) + takes(V) + time(O). 둘째 절: practicing a little every day(S) + can make(V) + a big difference(O). 두 절 모두 3형식입니다.","grammar":"동명사구가 하나의 활동을 나타내는 주어로 쓰이면 일반적으로 단수 취급하여 takes를 사용합니다. 조동사 can 뒤에는 동사원형 make를 씁니다. make a big difference는 큰 차이 또는 변화를 가져오다라는 뜻입니다.","vocab":[["take time","시간이 걸리다"],["practice a little every day","매일 조금씩 연습하다"],["make a big difference","큰 변화를 가져오다"],["동명사구 주어","일반적으로 단수 취급"]]}],"quizzes":[{"question":"Learning a new language takes time. 동사가 takes인 이유는?","choices":["동명사구 주어를 단수로 취급하기 때문에","language가 복수이기 때문에","과거 시제이기 때문에"],"correct":0,"explanation":"Learning a new language 전체가 동명사구 주어이고 단수 취급하기 때문에 takes를 사용합니다."},{"question":"Practicing English every day (　　) a big difference.","choices":["make","makes","making","are making"],"correct":1,"explanation":"Practicing English every day는 단수 취급하는 동명사구 주어이므로 makes가 맞습니다. 주어 + 동사 + 목적어의 3형식입니다."}]},{"day":4,"date":"2026.10.29 · 목요일","items":[{"en":"The more you understand how something works, the easier it becomes to solve problems related to it.","mine":"무언가가 어떻게 작동되는지 더 많이 이해할 수록 그와 관련된 문제들이 더 쉽게 해결된다.","ko":"어떤 것이 어떻게 작동하는지를 더 많이 이해할수록, 그것과 관련된 문제를 해결하기가 더 쉬워진다.","evaluation":"전체 의미와 “~할수록 더 …하다”라는 비교급의 관계를 매우 정확하게 파악했습니다. 다만 “문제들이 더 쉽게 해결된다”보다는 “문제를 해결하는 것이 더 쉬워진다”가 원문의 초점을 더 정확히 살립니다. 문제가 저절로 해결된다는 뜻이 아니라, 해결하는 행위가 쉬워진다는 뜻입니다.","editing":"표현 다듬기: “이해할 수록”은 “이해할수록”으로 붙여 쓰고, “작동되는지”는 “작동하는지”로 쓰면 더 자연스럽습니다.","vocab":[["the more","더 많이 ~할수록"],["understand","이해하다"],["how something works","어떤 것이 어떻게 작동하는지"],["work","작동하다, 기능하다 (이 문장에서는 “일하다”가 아님)"],["the easier","그만큼 더 쉽게 / 더 쉬운"],["become","~이 되다, ~해지다"],["solve problems","문제를 해결하다"],["related to","~와 관련된"]],"structure":"앞부분: The more you understand how something works, → 어떤 것이 어떻게 작동하는지를 더 많이 이해할수록. 뒷부분: the easier it becomes to solve problems related to it. → 그것과 관련된 문제를 해결하기가 더 쉬워진다.","grammar":"핵심 구문: The + 비교급, the + 비교급 = ~할수록 더욱 …하다. 이해하는 정도가 커질수록 문제 해결의 쉬운 정도도 커지는 관계를 나타냅니다.","details":[["① The + 비교급, the + 비교급","첫 절의 more는 understand를 수식하고, 둘째 절의 easier는 easy의 비교급입니다. 두 the는 일반적인 정관사 “그”로 번역하지 않고 변화의 정도를 연결합니다.","The more you practice, the better you become.","연습을 많이 할수록 더 잘하게 된다."],["② 간접의문문: how something works","understand의 목적어 역할을 합니다. “의문사 + 주어 + 동사” 어순이므로 how + something + works가 됩니다. 직접의문문 How does something work?와 어순을 구별하세요. something은 단수이므로 현재형 동사는 works입니다.","You understand how something works.","어떤 것이 어떻게 작동하는지를 이해한다."],["③ 가주어 it · 진주어 to부정사","일반적인 어순은 It becomes easier to solve problems related to it.입니다. 첫 it은 가주어이며, to solve problems related to it이 진주어입니다. 비교급 구문에서 easier가 앞으로 이동해 the easier it becomes …가 됩니다.","It becomes easier to solve problems.","문제를 해결하는 것이 더 쉬워진다."],["④ 뒤에서 명사 수식: problems related to it","related to it은 앞의 명사 problems를 뒤에서 수식하는 과거분사구입니다. problems which are related to it으로 풀어 쓸 수 있습니다. 마지막 it은 앞의 something을 가리키며, 가주어 it과 역할이 다릅니다.","problems related to it = problems which are related to it","그것과 관련된 문제들"]]}],"quizzes":[{"question":"빈칸에 알맞은 말을 고르세요. The more you understand how something works, the (　　) it becomes to solve problems related to it.","choices":["easy","easier","easiest","easily"],"correct":1,"explanation":"정답은 easier입니다. The + 비교급, the + 비교급 구문이므로 easy의 비교급 easier를 씁니다. “더 많이 이해할수록 문제를 해결하기가 더 쉬워진다”라는 뜻입니다."},{"question":"원문에 나온 두 it에 대한 설명으로 알맞은 것은?","choices":["두 it 모두 앞의 something을 가리킨다.","첫 it은 problems를, 마지막 it은 you를 가리킨다.","첫 it은 가주어이고, 마지막 it은 something을 가리킨다.","첫 it은 가주어이고, 마지막 it은 how를 가리킨다."],"correct":2,"explanation":"it becomes의 it은 가주어이고, 진주어는 to solve problems related to it입니다. related to it의 마지막 it은 something을 가리킵니다."}]}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(day){const d=DATA.find(x=>x.day===day);if(!d)return;document.querySelectorAll('.daybtn').forEach(b=>{b.classList.toggle('active',Number(b.dataset.day)===day);b.setAttribute('aria-current',Number(b.dataset.day)===day?'page':'false')});document.getElementById('date').textContent=d.date;document.getElementById('heading').textContent='Day '+String(day).padStart(2,'0');const root=document.getElementById('lessons');root.innerHTML=d.items.map((s,i)=>`<article class="card"><div class="eyebrow">SENTENCE ${String(i+1).padStart(2,'0')}</div><p class="en" lang="en">${esc(s.en)}</p>${s.details?'<p class="lesson-goal">학습 목표 · 비교급 구문과 문장 구조 이해하기</p>':''}<button class="action reveal" aria-expanded="false">해설 보기 ↓</button><div class="answer" hidden><h3>${s.evaluation?'추천 해석':'자연스러운 해석'}</h3><p>${esc(s.ko)}</p>${s.mine?`<h3>내가 작성한 해석</h3><p class="mine">${esc(s.mine)}</p>`:''}${s.evaluation?`<h3>해석 평가</h3><div class="score">95점 <small>/ 100점 · 매우 정확함</small></div><p>${esc(s.evaluation)}</p><p class="note">${esc(s.editing)}</p>`:''}<h3>핵심 어휘와 표현</h3>${s.details?`<table class="wordtable"><thead><tr><th scope="col">표현</th><th scope="col">뜻</th></tr></thead><tbody>${s.vocab.map(v=>`<tr><td lang="en">${esc(v[0])}</td><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table>`:`<div class="vocab">${s.vocab.map(v=>`<div>${esc(v[0])}</div><div>${esc(v[1])}</div>`).join('')}</div>`}<h3>문장 구조</h3><p class="note">${esc(s.structure)}</p><h3>문법 포인트</h3><p class="note">${esc(s.grammar)}</p>${s.details?s.details.map(p=>`<section class="grammar-detail"><h4>${esc(p[0])}</h4><p>${esc(p[1])}</p><div class="example"><p lang="en">${esc(p[2])}</p><p>${esc(p[3])}</p></div></section>`).join('')+'<p class="remember"><strong>오늘 꼭 기억할 것</strong><br>The + 비교급, the + 비교급 = ~할수록 더욱 …하다.</p>':''}</div></article>`).join('');root.querySelectorAll('.reveal').forEach(b=>b.addEventListener('click',()=>{let a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?'해설 보기 ↓':'해설 접기 ↑';b.setAttribute('aria-expanded',String(!a.hidden))}));if(d.quizzes){root.insertAdjacentHTML('beforeend',d.quizzes.map((q,i)=>`<article class="card quiz"><div class="eyebrow">CHECK QUIZ ${i+1}</div><h3>확인 문제 ${i+1}</h3><fieldset><legend>${esc(q.question)}</legend>${q.choices.map((c,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(c)}</label>`).join('')}</fieldset><button type="button" class="action check" data-q="${i}">정답 확인</button><button type="button" class="action retry">다시 풀기</button><p class="result" role="status" aria-live="polite"></p></article>`).join(''));root.querySelectorAll('.quiz').forEach(card=>{card.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{card.querySelector('.result').textContent=''}));card.querySelector('.retry').addEventListener('click',()=>{card.querySelectorAll('input').forEach(input=>input.checked=false);card.querySelector('.result').textContent='';card.querySelector('input').focus()})});root.querySelectorAll('.check').forEach(b=>b.addEventListener('click',()=>{const q=d.quizzes[+b.dataset.q],card=b.closest('.quiz'),sel=card.querySelector('input:checked');card.querySelector('.result').textContent=sel?(+sel.value===q.correct?'정답! ':'정답은 '+String.fromCharCode(65+q.correct)+'번. ')+q.explanation:'답을 먼저 골라 주세요.'}))}history.replaceState(null,'','#day-'+String(day).padStart(2,'0'))}document.querySelectorAll('.daybtn').forEach(b=>b.addEventListener('click',()=>render(+b.dataset.day)));function renderFromHash(){const initial=Number((location.hash.match(/^#day-0?(\d+)$/)||[])[1]||1);render(DATA.some(x=>x.day===initial)?initial:1)}window.addEventListener('hashchange',renderFromHash);renderFromHash();</script></body></html>
